[package]
name = "iskra-js-embassy"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
debug = 2
opt-level = "s"
lto = true
codegen-units = 1

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f405rg", "memory-x", "time-driver-tim2", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
