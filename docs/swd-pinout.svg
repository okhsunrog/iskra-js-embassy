<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Six-pin SWD connector pinout</title>
  <desc id="desc">From left to right: pin 6 SWO, pin 5 NRST, pin 4 SWDIO, pin 3 GND, pin 2 SWCLK, pin 1 3.3 V. Pin 1 is the square pad at the right.</desc>
  <rect width="1000" height="250" rx="16" fill="#fafbfc"/>
  <g fill="#161b22" font-family="sans-serif" font-size="32" text-anchor="middle">
    <text x="75" y="48">6</text>
    <text x="245" y="48">5</text>
    <text x="415" y="48">4</text>
    <text x="585" y="48">3</text>
    <text x="755" y="48">2</text>
    <text x="925" y="48">1</text>
    <text x="75" y="190">SWO</text>
    <text x="245" y="190">NRST</text>
    <text x="415" y="190">SWDIO</text>
    <text x="585" y="190">GND</text>
    <text x="755" y="190">SWCLK</text>
    <text x="925" y="190">3.3 V</text>
  </g>
  <g fill="#d9a039" stroke="#a36c20" stroke-width="4">
    <circle cx="75" cy="108" r="25"/>
    <circle cx="245" cy="108" r="25"/>
    <circle cx="415" cy="108" r="25"/>
    <circle cx="585" cy="108" r="25"/>
    <circle cx="755" cy="108" r="25"/>
    <rect x="900" y="83" width="50" height="50"/>
  </g>
  <text x="500" y="232" fill="#885715" font-family="sans-serif" font-size="23" text-anchor="middle">Pin 1 is the square pad (rightmost in this view)</text>
</svg>
